name: Build Android Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            package: platform-tools

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: |
          ./gradlew assembleDebug assembleRelease \
            :Bcore:assembleDebug \
            :Bcore:assembleRelease \
            :black-reflection:assemble \
            :compiler:assemble

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Bcore AARs
        uses: actions/upload-artifact@v4
        with:
          name: Bcore-AARs
          path: |
            Bcore/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30

      - name: Upload black-reflection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: black-reflection
          path: |
            black-reflection/build/libs/*.jar
            black-reflection/build/outputs/**/*.aar
          if-no-files-found: error
          retention-days: 30

      - name: Upload compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiler
          path: |
            compiler/build/libs/*.jar
            compiler/build/outputs/**/*.aar
          if-no-files-found: error
          retention-days: 30
