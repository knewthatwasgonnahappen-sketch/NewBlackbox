name: Build Android Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: |
          ./gradlew assembleDebug assembleRelease \
            :Bcore:assembleDebug \
            :Bcore:assembleRelease \
            :black-reflection:assemble \
            :compiler:assemble

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/**/*.apk
            Bcore/build/outputs/aar/*.aar
            black-reflection/build/libs/*.jar
            black-reflection/build/outputs/**/*.aar
            compiler/build/libs/*.jar
            compiler/build/outputs/**/*.aar
          if-no-files-found: error
          retention-days: 30
